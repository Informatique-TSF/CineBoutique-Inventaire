name: ci
on: [push, pull_request, workflow_dispatch]

env:
  AppSettings__SeedOnStartup: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_ENVIRONMENT: CI
      AppSettings__SeedOnStartup: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      PGPORT: 5432
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=inventory;Username=postgres;Password=postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PostgreSQL (no container)
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: 16
          database: inventory

      - name: Init CI DB user/password (mirror docker-compose env)
        run: |
          psql -d postgres <<'SQL'
          DO $do$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='postgres') THEN
              CREATE ROLE postgres WITH LOGIN SUPERUSER PASSWORD 'postgres';
            ELSE
              ALTER ROLE postgres WITH PASSWORD 'postgres';
            END IF;
          END
          $do$;
          GRANT ALL PRIVILEGES ON DATABASE inventory TO postgres;
          SQL

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if psql -d postgres -c 'select 1' >/dev/null 2>&1; then
              echo "DB ready"; exit 0;
            fi
            sleep 1
          done
          echo "DB not ready in time"; exit 1

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Export DB env
        run: |
          echo "ConnectionStrings__Default=Host=127.0.0.1;Port=5432;Database=inventory;Username=postgres;Password=postgres" >> $GITHUB_ENV
          echo "TEST_DB_CONN=Host=127.0.0.1;Port=5432;Database=inventory;Username=postgres;Password=postgres" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore --locked-mode --verbosity minimal

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test (.NET) - TRX + couverture
        run: |
          rm -rf test-results/dotnet
          mkdir -p test-results/dotnet
          dotnet test --no-build -c Release \
            --logger "trx;LogFileName=test.trx" \
            --results-directory "test-results/dotnet" \
            --collect:"XPlat Code Coverage;Format=cobertura"

      # Un test d'intégration ignoré (pas de base) rendrait la CI verte à tort.
      - name: Guard - aucun test .NET ignoré
        run: |
          status=0
          for trx in $(find test-results/dotnet -name '*.trx'); do
            counters=$(grep -o '<Counters [^>]*>' "$trx" | head -1)
            skipped=$(echo "$counters" | grep -oE 'notExecuted="[0-9]+"' | grep -oE '[0-9]+' || echo 0)
            total=$(echo "$counters" | grep -oE 'total="[0-9]+"' | grep -oE '[0-9]+' || echo 0)
            echo "$trx : total=$total ignorés=$skipped"
            if [ "${skipped:-0}" != "0" ]; then status=1; fi
          done
          if [ "$status" != "0" ]; then
            echo "::error::Des tests .NET ont été ignorés (base de test indisponible ?)"; exit 1
          fi

      - name: Audit NuGet (paquets vulnérables, transitifs inclus)
        run: |
          dotnet list CineBoutique.Inventory.sln package --vulnerable --include-transitive | tee nuget-audit.txt
          if grep -qE 'High|Critical|Élevée|Critique' nuget-audit.txt; then
            echo "::error::Vulnérabilité High/Critical dans les paquets NuGet"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace deps (root lockfile)
        run: npm ci --no-audit --no-fund

      - name: Guard - encodage des sources (aucun caractère U+FFFD)
        run: |
          if LC_ALL=C grep -rl $'\xef\xbf\xbd' src/inventory-web/src src/inventory-api src/inventory-infra --include='*.ts' --include='*.tsx' --include='*.cs'; then
            echo "::error::Caractère de remplacement U+FFFD trouvé : fichier mal encodé"; exit 1
          fi
          echo "Encodage OK"

      - name: Lint web
        run: npm -w src/inventory-web run lint

      - name: Typecheck web
        run: npm -w src/inventory-web run typecheck

      - name: Test web (Vitest + couverture)
        run: npm -w src/inventory-web run test -- --reporter=dot --coverage

      - name: Build web
        run: npm -w src/inventory-web run build

      - name: Audit npm (dépendances livrées uniquement)
        run: npm audit --omit=dev --audit-level=high

      - name: ReportGenerator (HTML)
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
          reportgenerator \
            -reports:'test-results/dotnet/**/coverage.cobertura.xml' \
            -targetdir:'test-results/dotnet/coverage-report' \
            -reporttypes:'HtmlInline;Cobertura'

      - name: Upload TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-trx
          path: test-results/dotnet/**/*.trx

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            test-results/dotnet/coverage-report/**
            src/inventory-web/coverage/**
