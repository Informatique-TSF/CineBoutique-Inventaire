# En prod, la DB n'est pas publiée : docker-compose.yml ne déclare aucun port pour db.
services:
  api:
    env_file:
      - secrets.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_DETAILEDERRORS: "false"
      APPLY_MIGRATIONS: "true"
      DISABLE_MIGRATIONS: "false"
      AppSettings__SeedOnStartup: "false"
      DISABLE_SERILOG: "false"
      Serilog__MinimumLevel__Default: "Information"
      Serilog__WriteTo__0__Name: "Console"
      ASPNETCORE_URLS: http://0.0.0.0:8080
      AppSettings__CatalogEndpointsPublic: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    env_file:
      - secrets.env
    build:
      context: .
      dockerfile: Dockerfile.inventory-web
      args:
        BASE_REG: public.ecr.aws/docker/library
    environment:
      PUBLIC_HOST: "inventaire.tsf.fr"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./ssl:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
